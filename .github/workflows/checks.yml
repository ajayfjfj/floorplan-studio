name: Project checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Check training and geometry utilities
        run: python -m unittest discover -s tests -v
      - name: Check browser geometry
        run: node tests/test_browser_geometry.cjs
      - name: Verify browser assets and examples
        run: python scripts/verify_web.py
      - name: Check JavaScript syntax
        run: |
          node --check web/dist/app.js
          node --check web/dist/inference-worker.js
          node --check web/dist/geometry.js
