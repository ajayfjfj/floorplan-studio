[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floorplan-segformer"
version = "0.1.0"
description = "Fine-tuning SegFormer for architectural floor-plan parsing"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<3", "transformers==4.57.6", "numpy>=1.26,<2.3", "Pillow>=11,<13", "opencv-python-headless==4.12.0.88", "scipy>=1.13,<2", "jsonschema>=4.23,<5", "matplotlib>=3.9,<4", "tqdm>=4.67,<5", "requests>=2.32,<3"]

[project.optional-dependencies]
browser = ["onnx==1.23.2", "onnxruntime==1.31.1"]

[project.scripts]
floorplan = "floorplan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
floorplan = ["*.json"]
